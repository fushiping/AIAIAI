services:
  fushi-vip:
    build: .
    container_name: fushi-ai-vip
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 18930
    ports:
      - "127.0.0.1:${HOST_PORT:-18930}:18930"
    volumes:
      - fushi-data:/app/data
      - fushi-storage:/app/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:18930/api/public/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fushi-data:
  fushi-storage:
